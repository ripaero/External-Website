<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rip Aero</title>
  <meta name="description" content="Rip Aero. Coming soon." />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 92'%3E%3Crect width='60' height='92' fill='%2304070A'/%3E%3Cpath d='M7%205.95%20H53%20C54.16%2021.65%2042.25%2033.21%2033.31%2044.5%20H26.69%20C17.75%2033.21%205.84%2021.65%207%205.95%20Z' fill='none' stroke='%23E8EEF2' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M26.69%2047.5%20H33.31%20C42.25%2058.79%2054.16%2070.35%2053%2086.05%20H7%20C5.84%2070.35%2017.75%2058.79%2026.69%2047.5%20Z' fill='none' stroke='%232FD3C0' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ---------- Brand tokens ---------- */
    :root {
      --space:  #04070A;  /* what's behind the hole */
      --ink:    #E8EEF2;  /* text on dark */
      --muted:  #7D8C99;
      --teal:   #2FD3C0;  /* accent on dark */
      --teal-light: #14897F; /* accent on white */
      --navy:   #0B1F2E;     /* ink on white */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--space);
      color: var(--ink);
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- What the hole reveals ---------- */
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
    .content { position: relative; display: flex; flex-direction: column; align-items: center;
                /* scale everything with the screen, so big monitors keep the same proportions */
                font-size: clamp(44px, min(9vw, 11.1vh), 240px); }

    .lockup { display: flex; align-items: center; gap: 0.36em; font-size: 1em; cursor: pointer; user-select: none; }
    .mark { height: 1.4em; width: auto; overflow: visible; }
    .mark path { fill: none; stroke-width: 2.27; stroke-linejoin: round; }
    .mark .chamber { stroke: var(--ink); }
    .mark .bell    { stroke: var(--teal); }

    .word { display: flex; flex-direction: column; align-items: center; height: 1.4em; margin-left: -0.1em; font-family: 'Audiowide', sans-serif; font-size: 1em; font-weight: 400; line-height: 1; transform: translateY(7px); }
    .word .rip  { font-size: 1em; letter-spacing: 0.04em; }
    .word .aero { font-size: 0.2em; letter-spacing: 1.05em; margin-right: -1.05em; color: #A9B4BD; }

    .status {
      margin-top: 3.5em;
      display: flex; flex-direction: column; align-items: center; gap: 0.8em;
      font-size: max(12px, 0.12em); letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    }
    .status b { font-weight: 500; color: var(--teal); }
    .status a { color: var(--muted); text-decoration: none; letter-spacing: 0.08em; text-transform: none; }
    .status a:hover { color: var(--ink); }

    /* ---------- The torn sheets (drawn on a canvas above the content) ---------- */
    #sheet { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; }

    footer {
      position: fixed; left: 0; right: 0; bottom: 18px; z-index: 30;
      text-align: center; font-size: max(11px, 1.2vh); letter-spacing: 0.12em; color: #5A5A5A;
    }

    #rocket { position: fixed; top: 0; left: 0; z-index: 40; width: 114px; height: 39px; will-change: transform; display: none; }
    .plume { transform-origin: 45px 19.5px; animation: flicker .07s steps(2) infinite alternate; }
    @keyframes flicker { from { transform: scaleX(1); opacity: 1; } to { transform: scaleX(.86); opacity: .85; } }
  </style>
  <noscript><style>#sheet, #rocket { display: none; }</style></noscript>
</head>

<body>
  <main id="stage">
    <svg id="stars" aria-hidden="true"></svg>
    <div class="content" id="content">
      <div class="lockup" id="lockup" title="Replay">
        <svg class="mark" viewBox="0 0 60 92" role="img" aria-label="Rip Aero mark">
          <path class="chamber" d="M7 5.95 H53 C54.16 21.65 42.25 33.21 33.31 44.5 H26.69 C17.75 33.21 5.84 21.65 7 5.95 Z" />
          <path class="bell"    d="M26.69 47.5 H33.31 C42.25 58.79 54.16 70.35 53 86.05 H7 C5.84 70.35 17.75 58.79 26.69 47.5 Z" />
        </svg>
        <h1 class="word"><span class="rip">RIP</span><span class="aero">AERO</span></h1>
      </div>
      <div class="status">
        <span><b>Site under construction</b></span>
        <a href="mailto:business@ripaero.space">business@ripaero.space</a>
      </div>
    </div>
  </main>

  <canvas id="sheet" aria-hidden="true"></canvas>
  <footer>&copy; 2026 Rip Aero</footer>

  <svg id="rocket" viewBox="0 0 76 26" aria-hidden="true">
    <defs>
      <linearGradient id="pl" x1="0" x2="1">
        <stop offset="0"   stop-color="#FFE7B8" stop-opacity="0" />
        <stop offset=".65" stop-color="#FFE7B8" stop-opacity=".55" />
        <stop offset="1"   stop-color="#FFFFFF" />
      </linearGradient>
    </defs>
    <path class="plume" d="M0 13 Q16 8 30 10.5 L30 15.5 Q16 18 0 13Z" fill="url(#pl)" />
    <path d="M33 7 L27 2 L41 6Z  M33 19 L27 24 L41 20Z" fill="#9FB0BC" />
    <rect x="28.5" y="9.5" width="5" height="7" rx="1" fill="#5E707D" />
    <path d="M32 7.5 H58 Q71 8 75 13 Q71 18 58 18.5 H32Z" fill="#E8EEF2" />
    <rect x="44" y="7.5" width="3" height="11" fill="#2FD3C0" />
  </svg>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const cv = $('sheet'), ctx = cv.getContext('2d'), rocket = $('rocket');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---------- seeded noise: every load tears a little differently ----------
    let seed = (Date.now() % 100000) + 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const N = 360;
    function octave(cells) {
      const v = Array.from({ length: cells + 2 }, () => rnd() * 2 - 1);
      return Float32Array.from({ length: N + 1 }, (_, i) => {
        const x = i / N * cells, k = Math.floor(x), f = x - k, s = f * f * (3 - 2 * f);
        return v[k] * (1 - s) + v[k + 1] * s;
      });
    }
    const fractal = (a, b, c, d) => { const o1 = octave(a), o2 = octave(b), o3 = octave(c), o4 = octave(d);
      return o1.map((_, i) => o1[i] + o2[i] * 0.5 + o3[i] * 0.25 + o4[i] * 0.12); };
    const unit = arr => arr.map(v => Math.max(0, Math.min(1, v * 0.5 + 0.5)));

    // noise channels
    let jag, shapeU, shapeL, crackW, band = [];
    function newTear() {
      jag = fractal(6, 19, 63, 170);                  // shared tear line (edges mirror)
      shapeU = unit(fractal(4, 11, 31, 90));          // hole outline, upper side
      shapeL = unit(fractal(4, 11, 31, 90));          // hole outline, lower side
      crackW = unit(octave(13));
      band = [];                                      // per-contour fibre fuzz + band widths
      for (let k = 0; k < 4; k++) band.push({ wU: unit(fractal(7, 23, 70, 160)), wL: unit(fractal(7, 23, 70, 160)), fU: octave(200), fL: octave(200) });
    }

    // ---------- geometry ----------
    let W, H, dpr, A, B, n, bow, sc, sig, ampU, ampL, Lpx, sEnd;
    function P(s) {
      const b = bow * Math.sin(Math.PI * s);
      return { x: A.x + (B.x - A.x) * s + n.x * b, y: A.y + (B.y - A.y) * s + n.y * b };
    }
    // project a screen point onto the (straight) tear axis: returns [s, signed distance along n]
    function project(x, y) {
      const dx = B.x - A.x, dy = B.y - A.y, L2 = dx * dx + dy * dy;
      const s = ((x - A.x) * dx + (y - A.y) * dy) / L2;
      const p = P(s);
      return [s, (x - p.x) * n.x + (y - p.y) * n.y];
    }
    const gauss = s => Math.exp(-0.5 * ((s - sc) / sig) ** 2);
    const shapeAt = (arr, s) => arr[Math.max(0, Math.min(N, Math.round(s * N)))];

    function geom() {
      W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      A = { x: -0.04 * W, y: 0.80 * H };                  // enters on the left edge, 1/5 of the way up
      B = { x:  1.06 * W, y: 0.10 * H };                  // leaves on the right side, below the top corner
      const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      n = { x: dy / L, y: -dx / L };                      // normal toward the upper-left side
      bow = -0.035 * Math.min(W, H);

      // size the hole so the whole content block sits inside it, with room for the torn rims
      const r = $('content').getBoundingClientRect();
      const fs = parseFloat(getComputedStyle($('content')).fontSize), narrow = W < 640;
      const pad = narrow ? 6 : fs * 0.18, margin = narrow ? 38 : fs * 0.7;
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const fx = i / 8;
        pts.push([r.left - pad + fx * (r.width + 2 * pad), r.top - pad], [r.left - pad + fx * (r.width + 2 * pad), r.bottom + pad]);
        pts.push([r.left - pad, r.top - pad + fx * (r.height + 2 * pad)], [r.right + pad, r.top - pad + fx * (r.height + 2 * pad)]);
      }
      const proj = pts.map(([x, y]) => project(x, y));
      const ss = proj.map(p => p[0]);
      sc = (Math.min(...ss) + Math.max(...ss)) / 2 + 0.02;
      sig = Math.max(0.1, (Math.max(...ss) - Math.min(...ss)) * 0.55);
      ampU = 0; ampL = 0;
      for (const [s, d] of proj) {
        const g = gauss(s);
        if (d >= 0) ampU = Math.max(ampU, (d + margin) / (g * (0.75 + 0.5 * shapeAt(shapeU, s)) ));
        else        ampL = Math.max(ampL, (-d + margin) / (g * (0.75 + 0.5 * shapeAt(shapeL, s)) ));
      }
      ampU *= 1.04; ampL *= 1.0;
      Lpx = Math.hypot(B.x - A.x, B.y - A.y);
      sEnd = sc + 2 * 1.25 * Math.max(ampU / TAN_U, ampL / TAN_L) / Lpx + 0.04;
    }

    // ---------- paper texture ----------
    function grain(base, alpha) {
      const c = document.createElement('canvas'); c.width = c.height = 160;
      const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 160, 160);
      const img = g.getImageData(0, 0, 160, 160), d = img.data;
      for (let i = 0; i < d.length; i += 4) { const v = (Math.random() - 0.5) * 255 * alpha; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
      g.putImageData(img, 0, 0);
      return ctx.createPattern(c, 'repeat');
    }
    let PAPER, GALAXY;
    function galaxy() {
      const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
      const g = c.getContext('2d'); g.scale(dpr, dpr);
      g.fillStyle = '#05060A'; g.fillRect(0, 0, W, H);
      const D = Math.hypot(W, H);
      // a faint milky band running roughly against the tear
      const cloud = (x, y, r, col, a) => {
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0));
        g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
      };
      const cols = ['rgba(52,74,120,A)', 'rgba(78,52,110,A)', 'rgba(24,96,96,A)', 'rgba(120,96,140,A)', 'rgba(40,56,90,A)'];
      for (let i = 0; i < 46; i++) {
        const t = rnd(), off = (rnd() - 0.5) * 0.32 * D;
        const x = W * (0.05 + 0.95 * t) + off * 0.55, y = H * (0.05 + 0.6 * t) + off * 0.8;
        cloud(x, y, D * (0.05 + rnd() * 0.16), cols[Math.floor(rnd() * cols.length)], (0.08 + rnd() * 0.14).toFixed(3));
      }
      // dark dust lanes
      for (let i = 0; i < 14; i++) {
        const t = rnd();
        cloud(W * t, H * (0.1 + 0.55 * t) + (rnd() - 0.5) * 0.15 * H, D * (0.03 + rnd() * 0.07), 'rgba(3,4,7,A)', (0.35 + rnd() * 0.3).toFixed(2));
      }
      // stars: many faint, some bright, a few with a soft halo; denser along the band
      const count = Math.round(W * H / 700);
      for (let i = 0; i < count; i++) {
        let x = rnd() * W, y = rnd() * H;
        if (rnd() < 0.45) { const t = rnd(); x = W * t + (rnd() - 0.5) * 0.25 * W; y = H * (0.05 + 0.6 * t) + (rnd() - 0.5) * 0.22 * H; }
        const m = rnd(), r = m < 0.97 ? 0.35 + rnd() * 0.55 : 1 + rnd() * 0.9;
        const tint = rnd(), col = tint < 0.12 ? '200,220,255' : tint < 0.2 ? '255,232,205' : '235,238,242';
        g.fillStyle = 'rgba(' + col + ',' + (0.25 + rnd() * 0.65).toFixed(2) + ')';
        g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
        if (r > 1.2) { const h = g.createRadialGradient(x, y, 0, x, y, r * 6); h.addColorStop(0, 'rgba(' + col + ',.25)'); h.addColorStop(1, 'rgba(' + col + ',0)'); g.fillStyle = h; g.fillRect(x - r * 6, y - r * 6, r * 12, r * 12); }
      }
      // fine print grain, so it still reads as a sheet
      g.globalAlpha = 0.5; g.fillStyle = grain('#000', 0.06); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'overlay';
      g.fillRect(0, 0, c.width, c.height);
      return c;
    }
    function textures() {
      PAPER = [
        null,                     // sheet 1 face: the galaxy (drawn separately)
        grain('#FFFFFF', 0.08),   // torn core of the top sheet (off-white)
        grain('#FFFFFF', 0.12),   // inner ply (cool gray, like lunar dust)
        grain('#FFFFFF', 0.10),   // inner ply torn core (light gray)
      ];
    }

    // ---------- draw ----------
    // open  : 0..1 how far the hole has opened (after the rocket passes)
    // front : how far along the line the tear has travelled
    function contour(off, sMax) {         // off(i, s) => [upperOffset, lowerOffset]; only the torn part
      const up = [], lo = [];
      for (let i = 0; i <= N; i++) {
        const s = -0.02 + 1.04 * i / N;
        if (s > sMax) break;
        const p = P(s), [ou, ol] = off(i, s);
        up.push([p.x + n.x * ou, p.y + n.y * ou]);
        lo.push([p.x - n.x * ol, p.y - n.y * ol]);
      }
      return up.concat(lo.reverse());
    }
    function pathOf(poly) { ctx.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]); ctx.closePath(); }

    // The hole opens like the wake behind a supersonic body: a cone trailing the rocket.
    // Near the apex the opening grows linearly with distance behind the front (half-angle = Mach angle),
    // then eases into the final hole outline.
    const TAN_U = 0.5, TAN_L = 0.42;          // upper / lower wake half-angles (slightly asymmetric)
    function wake(target, dist, tan) {
      if (target <= 0 || dist <= 0) return 0;
      const x = Math.min(1, dist * tan / (2 * target));
      return target * (1 - (1 - x) * (1 - x));
    }
    function draw(front) {
      ctx.clearRect(0, 0, W, H);
      if (Math.min(1.02, front) <= -0.01) { ctx.drawImage(GALAXY, 0, 0, W, H); return; }
      // offsets of the outermost tear edge
      const base = (i, s) => {
        const behind = Math.max(0, front - s), dist = behind * Lpx, torn = Math.min(1, behind * 10);
        const crack = (1.5 + 3.5 * crackW[i]) * Math.min(1, behind * 6);
        const tu = ampU * gauss(s) * (0.75 + 0.5 * shapeU[i]);
        const tl = ampL * gauss(s) * (0.75 + 0.5 * shapeL[i]);
        const hu = wake(tu, dist, TAN_U), hl = wake(tl, dist, TAN_L);
        const f = tu > 0 ? hu / tu : 0;
        const j = jag[i] * (W < 640 ? 5 : 8) * torn * (1 + 1.2 * f * gauss(s));
        return { u: crack + hu, l: crack + hl, j, torn };
      };
      // band widths (outer -> inner): white core of sheet 1, black face of sheet 2, gray core of sheet 2
      const widths = [[1.2, 4.5], [1.5, 6], [0.8, 3]];
      const cache = [];
      for (let i = 0; i <= N; i++) cache.push(base(i, -0.02 + 1.04 * i / N));

      const offsets = [];                     // per contour level: function (i) => [u, l]
      for (let k = 0; k <= 3; k++) {
        offsets.push(i => {
          const b = cache[i];
          let u = b.u, l = b.l;
          for (let m = 0; m < k; m++) {
            const [mn, mx] = widths[m], sc2 = Math.min(1, (b.u + b.l) / 24);
            u -= (mn + (mx - mn) * band[m].wU[i]) * sc2;
            l -= (mn + (mx - mn) * band[m].wL[i]) * sc2;
          }
          const fz = 1.1 * b.torn;
          u = Math.max(0, u) + band[k].fU[i] * fz;
          l = Math.max(0, l) + band[k].fL[i] * fz;
          return [u + b.j, l - b.j];
        });
      }
      const sMax = Math.min(1.02, front);
      if (sMax <= -0.01) return;
      const polys = offsets.map(f => contour((i) => f(i), sMax));
      if (polys[0].length < 4) { ctx.drawImage(GALAXY, 0, 0, W, H); return; }

      // layer k fills: (contour k-1 outside) minus (contour k) ; layer 0 = whole screen minus contour 0
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        if (k === 0) { ctx.rect(-10, -10, W + 20, H + 20); } else { pathOf(polys[k - 1]); }
        pathOf(polys[k]);
        if (k === 0) { ctx.save(); ctx.clip('evenodd'); ctx.drawImage(GALAXY, 0, 0, W, H); ctx.restore(); }
        else { ctx.fillStyle = PAPER[k]; ctx.fill('evenodd'); }
        // thin shadow line where a layer ends, so the stack reads as separate sheets
        ctx.beginPath(); pathOf(polys[k]);
        ctx.strokeStyle = k % 2 ? 'rgba(0,0,0,.45)' : 'rgba(0,0,0,.6)';
        ctx.lineWidth = k === 3 ? 1.5 : 0.8;
        ctx.stroke();
      }
    }

    function placeRocket(s, t) {
      const p = P(s), q = P(s + 0.002);
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + Math.sin(t / 45) * 0.8;
      rocket.style.transformOrigin = '93px 19.5px';
      rocket.style.transform = 'translate(' + (p.x - 93).toFixed(1) + 'px,' + (p.y - 19.5).toFixed(1) + 'px) rotate(' + ang.toFixed(1) + 'deg)';
    }

    // ---------- stars behind the hole ----------
    function stars() {
      const svg = $('stars'); svg.innerHTML = '';
      const count = Math.round(innerWidth * innerHeight / 9000);
      for (let i = 0; i < count; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'), big = rnd() < 0.06;
        c.setAttribute('cx', (rnd() * 100).toFixed(2) + '%'); c.setAttribute('cy', (rnd() * 100).toFixed(2) + '%');
        c.setAttribute('r', big ? 1.1 : 0.6); c.setAttribute('fill', '#C9D4DC');
        c.setAttribute('opacity', (big ? 0.55 : 0.12 + rnd() * 0.3).toFixed(2));
        svg.appendChild(c);
      }
    }

    // ---------- timeline ----------
    // The rocket crosses at a steady speed; the wake keeps opening behind it until the hole is complete.
    const CROSS = 1900;                                  // ms for the rocket to cross the screen
    let raf = 0, done = false;

    function play() {
      cancelAnimationFrame(raf); done = false;
      newTear(); geom(); GALAXY = galaxy();
      if (reduce) { draw(sEnd); done = true; return; }
      rocket.style.display = 'block';
      const v = 1.14 / CROSS, start = performance.now();
      function frame(now) {
        const t = now - start, front = Math.min(sEnd, -0.06 + v * t);
        draw(front);
        if (front < 1.08) placeRocket(front, t); else rocket.style.display = 'none';
        if (front >= sEnd) { rocket.style.display = 'none'; done = true; return; }
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    }

    textures(); stars();
    // wait for fonts so the hole is sized to the real wordmark
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
    $('lockup').addEventListener('click', play);
    addEventListener('resize', () => { if (done) { geom(); GALAXY = galaxy(); draw(sEnd); } });
  })();
  </script>
</body>
</html>
