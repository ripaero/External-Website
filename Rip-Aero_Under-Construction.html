<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rip Aero — Coming Soon</title>
  <meta name="description" content="Rip Aero. Coming soon." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Sora', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: { 300: '#c4f1ff', 400: '#8fe3ff', 500: '#4fd1f5', 600: '#22b8e6' },
          },
        },
      },
    };
  </script>

  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: #000; }

    .grid-lines {
      background-image:
        linear-gradient(to right, rgba(143,227,255,0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(143,227,255,0.07) 1px, transparent 1px);
      background-size: 56px 56px;
    }
    .grid-masked {
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%);
    }
    .glass {
      background: rgba(143,227,255,0.04);
      border: 1px solid rgba(143,227,255,0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* The "background" that gets ripped: two halves */
    .panel { position: fixed; inset: 0; z-index: 20; background-color: #000; will-change: clip-path; }

    /* Glow behind the tear */
    #light {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(79,209,245,.55), rgba(0,0,0,0) 70%);
      transition: opacity 1.4s ease;
    }
    #stage.show #light { opacity: .35; }

    #edges { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none;
             filter: drop-shadow(0 0 6px #8fe3ff); transition: opacity .8s ease; }
    #edges polyline { fill: none; stroke: #c4f1ff; stroke-width: 1.5; stroke-linejoin: bevel; }

    #rocket { position: fixed; top: 0; left: 0; z-index: 40; width: 140px; height: 56px;
              filter: drop-shadow(0 0 14px rgba(143,227,255,.9)); will-change: transform; }
    .flame { transform-origin: 52px 28px; animation: flicker .09s ease-in-out infinite alternate; }
    @keyframes flicker { from { transform: scaleX(1); } to { transform: scaleX(.78); } }

    /* Final content */
    .rise { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
    #stage.show .rise { opacity: 1; transform: none; }
    #stage.show .r2 { transition-delay: .25s; }
    #stage.show .r3 { transition-delay: .5s; }

    @media (prefers-reduced-motion: reduce) {
      .rise { transition: none; }
      .flame { animation: none; }
    }
  </style>
  <noscript>
    <style>
      .panel, #rocket, #edges { display: none; }
      .rise { opacity: 1; transform: none; }
    </style>
  </noscript>
</head>

<body class="font-sans text-slate-300 antialiased">

  <!-- Revealed layer (sits behind the ripped background) -->
  <main id="stage" class="relative flex min-h-screen items-center justify-center overflow-hidden px-6 text-center">
    <div class="grid-lines grid-masked absolute inset-0"></div>
    <div id="light"></div>

    <div class="relative">
      <h1 id="title" title="Click to replay" class="rise r1 cursor-pointer font-display text-6xl font-extrabold leading-none tracking-tight text-white sm:text-8xl">
        Rip<span class="bg-gradient-to-r from-brand-300 to-brand-500 bg-clip-text text-transparent"> Aero</span>
      </h1>

      <div class="rise r2 mx-auto mt-8 h-px w-16 bg-brand-400/60"></div>

      <p class="rise r3 glass mx-auto mt-8 inline-flex items-center gap-3 rounded-full px-6 py-2.5 text-sm font-medium uppercase tracking-[0.25em] text-brand-400 sm:text-base">
        <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-brand-400"></span>
        Coming Soon
      </p>
    </div>
  </main>

  <!-- Ripped background halves -->
  <div id="top" class="panel grid-lines"></div>
  <div id="bot" class="panel grid-lines"></div>

  <!-- Glowing tear edges -->
  <svg id="edges" aria-hidden="true">
    <polyline id="edgeT" points="" />
    <polyline id="edgeB" points="" />
  </svg>

  <!-- Rocket (points right) -->
  <svg id="rocket" viewBox="0 0 140 56" aria-hidden="true">
    <defs>
      <linearGradient id="fl" x1="0" x2="1">
        <stop offset="0" stop-color="#8fe3ff" stop-opacity="0" />
        <stop offset="1" stop-color="#c4f1ff" />
      </linearGradient>
      <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#8fe3ff" />
      </linearGradient>
    </defs>
    <path class="flame" d="M0 28 Q30 12 52 21 L52 35 Q30 44 0 28Z" fill="url(#fl)" />
    <path d="M58 18 L40 3 L76 14Z" fill="#4fd1f5" />
    <path d="M58 38 L40 53 L76 42Z" fill="#4fd1f5" />
    <rect x="46" y="20" width="9" height="16" rx="2" fill="#22b8e6" />
    <path d="M52 18 H92 Q128 18 138 28 Q128 38 92 38 H52Z" fill="url(#bd)" />
    <circle cx="98" cy="28" r="6" fill="#000" stroke="#4fd1f5" stroke-width="2" />
  </svg>

  <script>
    const stage = document.getElementById('stage');
    const topP = document.getElementById('top');
    const botP = document.getElementById('bot');
    const rocket = document.getElementById('rocket');
    const edges = document.getElementById('edges');
    const edgeT = document.getElementById('edgeT');
    const edgeB = document.getElementById('edgeB');

    const N = 64;                                   // tear resolution
    const noise = Array.from({ length: N + 1 }, () => (Math.random() - 0.5) * 2);
    const T1 = 2800, T2 = 1300;                     // rocket flight, panels parting (ms)
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function render(rx, e, t) {
      const W = innerWidth, H = innerHeight;
      const tp = ['0px 0px', W + 'px 0px'];
      const bp = ['0px ' + H + 'px', W + 'px ' + H + 'px'];
      const tPts = [], bPts = [];
      const topEdge = [], botEdge = [];

      for (let i = N; i >= 0; i--) {
        const x = W * i / N;
        const base = Math.min(H * 0.55, Math.max(0, (rx - x) * 0.4));
        const gap = base + e * H * 1.25;
        const jag = noise[i] * Math.min(14, base * 0.5);
        const yT = H / 2 - gap / 2 + jag;
        const yB = H / 2 + gap / 2 + jag;
        tp.push(x.toFixed(1) + 'px ' + yT.toFixed(1) + 'px');
        bp.push(x.toFixed(1) + 'px ' + yB.toFixed(1) + 'px');
        if (base > 1 && e < 1) {
          topEdge.push(x.toFixed(1) + ',' + yT.toFixed(1));
          botEdge.push(x.toFixed(1) + ',' + yB.toFixed(1));
        }
      }

      const topClip = 'polygon(' + tp.join(',') + ')';
      const botClip = 'polygon(' + bp.join(',') + ')';
      topP.style.clipPath = topP.style.webkitClipPath = topClip;
      botP.style.clipPath = botP.style.webkitClipPath = botClip;
      edgeT.setAttribute('points', topEdge.join(' '));
      edgeB.setAttribute('points', botEdge.join(' '));

      const wobble = Math.sin(t / 28) * 1.6;
      rocket.style.transform = 'translate(' + (rx - 140) + 'px,' + (H / 2 - 28 + wobble) + 'px)';
    }

    function finish() {
      topP.style.display = botP.style.display = rocket.style.display = edges.style.display = 'none';
      stage.classList.add('show');
    }

    function play() {
      stage.classList.remove('show');
      topP.style.display = botP.style.display = rocket.style.display = edges.style.display = '';
      edges.style.opacity = 1;

      if (reduce) { finish(); return; }

      const start = performance.now();
      render(-150, 0, 0);

      function frame(now) {
        const t = now - start, W = innerWidth;
        let rx, e = 0;

        if (t < T1) {
          const u = t / T1;
          rx = -150 + Math.pow(u, 1.8) * (W + 300);   // accelerates across the screen
        } else {
          rx = W + 150;
          const u = Math.min(1, (t - T1) / T2);
          e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;  // ease in-out
          if (u > 0.4) stage.classList.add('show');
          edges.style.opacity = 1 - u;
          rocket.style.display = 'none';
        }

        render(rx, e, t);

        if (t < T1 + T2) requestAnimationFrame(frame);
        else finish();
      }
      requestAnimationFrame(frame);
    }

    play();
    document.getElementById('title').addEventListener('click', play);
  </script>
</body>
</html>
